name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/windows-build.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build with Java 21
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        shell: pwsh
        run: .\gradlew.bat build --no-daemon --stacktrace

      - name: Upload compiled JAR files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primordial-windows-build
          path: build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14
