name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/windows-build.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build with Java 21
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        shell: pwsh
        run: .\gradlew.bat build --no-daemon --stacktrace

      - name: Prepare Primordial.jar
        shell: pwsh
        run: |
          $jar = Get-ChildItem "build/libs/*.jar" |
            Where-Object { $_.Name -notmatch "-(sources|dev|javadoc)\.jar$" } |
            Select-Object -First 1
          if (-not $jar) {
            throw "Compiled mod JAR was not found in build/libs"
          }
          New-Item -ItemType Directory -Force -Path "output" | Out-Null
          Copy-Item $jar.FullName "output/Primordial.jar"

      - name: Upload Primordial.jar
        uses: actions/upload-artifact@v4
        with:
          name: Primordial
          path: output/Primordial.jar
          if-no-files-found: error
          retention-days: 14
